<!DOCTYPE html>
<!--
  PLANTILLA · Bloque 4 · 4.7 Reseñas (GET /admin/resenas?estado=PUBLICADA|OCULTA, AdminController).
  Modelo:
    estado   EstadoResena o null (filtro) · estados EstadoResena[]
    resenas  List<ResenaModeracion> (id, producto, talla, codigoComprobante, calificacion, titulo, comentario,
             cliente, emailCliente, fecha, estado, moderadaPor)
  Acciones: POST /admin/resenas/{id}/ocultar · POST /admin/resenas/{id}/publicar
  Adaptación de interfaz: filtros por estado y controles para publicar u ocultar reseñas.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: pagina(titulo='Reseñas · HÖSÉG', activa='resenas', contenido=~{::main})}">
<body><main class="hs-admin-page hs-reviews-page">
    <header class="hs-page-heading"><div><p class="hs-eyebrow">COMUNIDAD</p><h1>Reseñas</h1><p class="hs-page-desc">Modera las opiniones de clientes que realizaron una compra.</p></div></header>
    <section class="hs-admin-card" aria-labelledby="resenas-heading"><div class="hs-card-head hs-card-head--wrap"><div><h2 id="resenas-heading">Opiniones de productos</h2><p>Publica u oculta una reseña sin eliminar su registro.</p></div><div class="hs-inline-filters"><a class="hs-filter-pill" th:classappend="${estado == null} ? 'is-active'" th:href="@{/admin/resenas}">Todas</a><a class="hs-filter-pill" th:each="e : ${estados}" th:classappend="${e == estado} ? 'is-active'" th:href="@{/admin/resenas(estado=${e})}" th:text="${e.name() == 'PUBLICADA'} ? 'Publicadas' : 'Ocultas'">Publicadas</a></div></div>
        <div class="hs-review-list"><article class="hs-review" th:each="r : ${resenas}"><div class="hs-review-main"><div class="hs-review-top"><span class="hs-state" th:classappend="${r.estado.name() == 'PUBLICADA'} ? 'hs-state--pagado' : 'hs-state--anulado'" th:text="${r.estado.name() == 'PUBLICADA'} ? 'Publicada' : 'Oculta'">Publicada</span><time class="hs-muted" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}">Fecha</time></div><h3 th:text="${r.producto}">Producto</h3><p class="hs-review-meta"><span th:text="'Talla: ' + ${r.talla ?: 'Única'}">Talla</span> · <span th:text="${r.codigoComprobante}">WEB-000001</span></p><span class="hs-review-stars" aria-label="Calificación" th:attr="aria-label=|Calificación: ${r.calificacion} de 5 estrellas|" th:text="${#strings.repeat('★', r.calificacion)}">★★★★★</span><h4 th:text="${r.titulo}">Título</h4><p class="hs-review-text" th:text="${r.comentario}">Comentario</p><div class="hs-review-author"><i class="bi bi-person-circle" aria-hidden="true"></i> <span th:text="${r.cliente}">Cliente</span><span class="hs-muted" th:if="${r.moderadaPor}" th:text="'· Moderada por ' + ${r.moderadaPor}">Moderada</span></div></div><div class="hs-review-actions"><form method="post" th:action="${r.estado.name() == 'PUBLICADA'} ? @{/admin/resenas/{id}/ocultar(id=${r.id})} : @{/admin/resenas/{id}/publicar(id=${r.id})}"><button class="hs-admin-btn" th:classappend="${r.estado.name() == 'PUBLICADA'} ? 'hs-admin-btn--outline' : 'hs-admin-btn--primary'" type="submit"><i class="bi" th:classappend="${r.estado.name() == 'PUBLICADA'} ? 'bi-eye-slash' : 'bi-eye'" aria-hidden="true"></i><span th:text="${r.estado.name() == 'PUBLICADA'} ? 'Ocultar reseña' : 'Volver a publicar'">Ocultar</span></button></form></div></article><p th:if="${resenas.isEmpty()}" class="hs-empty-msg">No hay reseñas en esta vista.</p></div>
    </section>
</main></body></html>
