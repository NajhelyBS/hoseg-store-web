<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 2 · 2.2 Registro (GET/POST /registro, AuthController).
  Modelo:
    registroForm   RegistroClienteForm (nombre, apellido, tipoDoc, numDoc, email, telefono, direccion,
                   contrasena, confirmacion, aceptaTerminos). Errores globales: documentoValido, contrasenasCoinciden.
                   "email" y "numDoc" también reciben errores de negocio (ya registrado).
    tiposDocumento TipoDocumento[] (DNI, CE, PASAPORTE, RUC; etiqueta)
  Éxito: redirige a /login?registrado.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Crear cuenta · HÖSÉG', activa='cuenta',
                                          transparente=false, contenido=~{::main}, estilos=~{::link}, scripts=~{})}">
<link rel="stylesheet" th:href="@{/css/cuenta.css}">
<body>
<main class="hs-main--bajo-nav">
    <th:block th:replace="~{fragments/avisos :: avisos}"/>
    <section class="hs-cuenta">
        <div class="hs-cuenta__contenedor hs-cuenta__contenedor--registro">
            <h1 class="hs-h2 hs-cuenta__titulo">Crear cuenta</h1>
            <p class="hs-cuenta__intro">
                Regístrate para disfrutar de tu experiencia HÖSÉG.
            </p>

            <form th:object="${registroForm}" method="post" th:action="@{/registro}">
                <h2 class="hs-cuenta__subtitulo">Datos personales</h2>

                <label class="hs-cuenta__campo">
                    Nombre
                    <input class="hs-input" th:field="*{nombre}"
                           autocomplete="given-name" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{nombre}"></div>

                <label class="hs-cuenta__campo">
                    Apellido
                    <input class="hs-input" th:field="*{apellido}"
                           autocomplete="family-name" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{apellido}"></div>

                <label class="hs-cuenta__campo">
                    Tipo de documento
                    <select class="form-select" th:field="*{tipoDoc}" required>
                        <option value="">Selecciona tu documento</option>
                        <option th:each="t : ${tiposDocumento}"
                                th:value="${t}" th:text="${t.etiqueta}">DNI</option>
                    </select>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{tipoDoc}"></div>

                <label class="hs-cuenta__campo">
                    Número de documento
                    <input class="hs-input" th:field="*{numDoc}"
                           autocomplete="off" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{numDoc}"></div>
                <div class="text-danger hs-cuenta__error" th:errors="*{documentoValido}"></div>

                <h2 class="hs-cuenta__subtitulo">Datos de contacto</h2>

                <label class="hs-cuenta__campo">
                    Correo electrónico
                    <input class="hs-input" type="email" th:field="*{email}"
                           autocomplete="email" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{email}"></div>

                <label class="hs-cuenta__campo">
                    Celular <span class="hs-cuenta__opcional">(opcional)</span>
                    <input class="hs-input" type="tel" th:field="*{telefono}"
                           autocomplete="tel">
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{telefono}"></div>

                <label class="hs-cuenta__campo">
                    Dirección <span class="hs-cuenta__opcional">(opcional)</span>
                    <input class="hs-input" th:field="*{direccion}"
                           autocomplete="street-address">
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{direccion}"></div>

                <h2 class="hs-cuenta__subtitulo">Seguridad</h2>

                <label class="hs-cuenta__campo">
                    Contraseña
                    <input class="hs-input" type="password" th:field="*{contrasena}"
                           autocomplete="new-password" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{contrasena}"></div>

                <label class="hs-cuenta__campo">
                    Repite la contraseña
                    <input class="hs-input" type="password" th:field="*{confirmacion}"
                           autocomplete="new-password" required>
                </label>
                <div class="text-danger hs-cuenta__error" th:errors="*{confirmacion}"></div>
                <div class="text-danger hs-cuenta__error" th:errors="*{contrasenasCoinciden}"></div>

                <div class="hs-cuenta__terminos">
                    <label>
                        <input type="checkbox" th:field="*{aceptaTerminos}" required>
                        Acepto los <a th:href="@{/terminos}">términos</a>
                        y la política de privacidad.
                    </label>
                    <div class="text-danger hs-cuenta__error"
                         th:errors="*{aceptaTerminos}"></div>
                </div>

                <button class="hs-btn hs-btn--primario hs-cuenta__boton mt-4"
                        type="submit">
                    Crear cuenta
                </button>
            </form>
            <p class="hs-cuenta__enlaces">
                ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
