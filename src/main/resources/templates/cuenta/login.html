<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 2 · 2.1 Iniciar sesión (GET /login, AuthController; el POST lo procesa Spring Security).
  El formulario DEBE enviar los campos "email" y "password" por POST a /login (th:action añade el CSRF).
  Variantes por parámetro de la URL: ?error · ?bloqueado=5 (minutos) · ?registrado · ?restablecida
  Modelo:
    desdeCompra boolean: llegó desde "Confirmar compra" (aviso "tu carrito se conserva")
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo='Iniciar sesión · HÖSÉG', activa='cuenta',
                                          transparente=false, contenido=~{::main}, estilos=~{::link}, scripts=~{})}">


 <link rel="stylesheet" th:href="@{/css/cuenta.css}">
<body>
<main class="hs-main--bajo-nav">
    <th:block th:replace="~{fragments/avisos :: avisos}"/>
    <section class="hs-cuenta">
        <div class="hs-cuenta__contenedor">
            <h1 class="hs-h2 hs-cuenta__titulo">Iniciar sesión</h1>
            <p class="hs-cuenta__intro">
                ¡Qué bueno tenerte de vuelta!
            </p>

            <div class="alert alert-info" th:if="${desdeCompra}">
                Inicia sesión para confirmar; tu carrito se conserva.
            </div>
            <div class="alert alert-danger" th:if="${param.error}">
                Email o contraseña incorrectos.
            </div>
            <div class="alert alert-danger" th:if="${param.bloqueado}"
                 th:text="'Superaste los intentos permitidos. Intenta de nuevo en ' + ${param.bloqueado} + ' minuto(s).'">
                Bloqueado
            </div>
            <div class="alert alert-success" th:if="${param.registrado}">
                Tu cuenta está lista. Inicia sesión.
            </div>
            <div class="alert alert-success" th:if="${param.restablecida}">
                Cambiamos tu contraseña. Inicia sesión.
            </div>

            <form method="post" th:action="@{/login}">
                <label class="hs-cuenta__campo">
                    Email
                    <input class="hs-input" type="email" name="email"
                           autocomplete="email" required>
                </label>

                <label class="hs-cuenta__campo">
                    Contraseña
                    <input class="hs-input" type="password" name="password"
                           autocomplete="current-password" required>
                </label>

                <button class="hs-btn hs-btn--primario hs-cuenta__boton mt-3"
                        type="submit">
                    Ingresar
                </button>
            </form>

            <p class="hs-cuenta__enlaces">
                <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
                <span aria-hidden="true"> · </span>
                <a th:href="@{/registro}">Crear cuenta</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
