<!DOCTYPE html>
<!--
  ESQUELETO · Bloque 3 · 3.4 Página legal (GET /terminos y /politica-rsu, InstitucionalController).
  Una sola plantilla para ambas. Modelo:
    bloque           BloqueContenido o null (titulo, cuerpo, actualizadoEn) — lo edita el panel (4.5)
    tituloPorDefecto String, por si el bloque no tiene título
  El cuerpo es texto plano: th:text lo escapa (no se interpreta HTML guardado en la base).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(titulo=${bloque?.titulo ?: tituloPorDefecto} + ' · HÖSÉG', activa='',
                                          transparente=false, contenido=~{::main}, estilos=~{}, scripts=~{})}">
<body>
<main class="hs-main--bajo-nav">
    <section class="hs-seccion py-5">
        <div class="container hs-ancho-sm">
            <span class="hs-kicker text-uppercase tracking-wider">Documento Oficial</span>
            
            <h1 class="hs-h2 my-2 fw-bold" style="color: var(--hs-bark);" 
                th:text="${bloque?.titulo ?: tituloPorDefecto}">Términos y condiciones</h1>
            
            <p th:if="${bloque?.actualizadoEn}" class="text-muted small mb-4">
                <i class="bi bi-clock me-1"></i>
                <span th:text="'Actualizado el ' + ${#temporals.format(bloque.actualizadoEn, 'dd/MM/yyyy')}">Actualizado</span>
            </p>

            <hr class="my-4 text-black-50 opacity-10">

             <div class="hs-texto-secundario lh-lg" style="white-space: pre-line;" 
                 th:text="${bloque?.cuerpo ?: 'Contenido en preparación.'}">Texto</div>
                 
            <div class="mt-5 pt-3">
                <a href="/" class="hs-btn hs-btn--secundario rounded-pill">
                    <i class="bi bi-arrow-left me-2"></i>Volver al Inicio
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
