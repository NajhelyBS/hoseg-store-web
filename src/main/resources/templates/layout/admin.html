<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://thymeleaf.org"
      th:fragment="pagina(titulo, activa, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${titulo}">Panel · HÖSÉG</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/hoseg.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="d-flex min-vh-100">
    <nav class="p-3 border-end" style="min-width: 220px" aria-label="Panel">
        <!-- El logo lleva al inicio según el rol -->
        <a class="hs-logo d-block mb-4" sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/admin/panel}">HÖSÉG</a>
        <a class="hs-logo d-block mb-4" sec:authorize="hasRole('LOGISTICA')" th:href="@{/logistica/pedidos}">HÖSÉG</a>
        <a class="hs-logo d-block mb-4" sec:authorize="hasRole('GESTOR_IMPACTO')" th:href="@{/gestion-impacto/lotes}">HÖSÉG</a>

        <ul class="list-unstyled d-flex flex-column gap-2">
            <!-- Menú exclusivo de ADMINISTRADOR -->
            <th:block sec:authorize="hasRole('ADMINISTRADOR')">
                <li><a th:href="@{/admin/panel}" th:classappend="${activa == 'panel'} ? 'fw-bold'">Panel</a></li>
                <li><a th:href="@{/admin/catalogo}" th:classappend="${activa == 'catalogo'} ? 'fw-bold'">Catálogo web</a></li>
                <li><a th:href="@{/admin/cafe}" th:classappend="${activa == 'cafe'} ? 'fw-bold'">Höség Café</a></li>
                <li><a th:href="@{/admin/contenido}" th:classappend="${activa == 'contenido'} ? 'fw-bold'">Contenido</a></li>
                <li><a th:href="@{/admin/mensajes}" th:classappend="${activa == 'mensajes'} ? 'fw-bold'">Mensajes</a></li>
                <li><a th:href="@{/admin/resenas}" th:classappend="${activa == 'resenas'} ? 'fw-bold'">Reseñas</a></li>
            </th:block>

            <!-- Menú exclusivo de LOGÍSTICA -->
            <th:block sec:authorize="hasRole('LOGISTICA')">
                <li><a th:href="@{/logistica/pedidos}" th:classappend="${activa == 'logistica'} ? 'fw-bold'">Pedidos y despachos</a></li>
            </th:block>

            <!-- Menú exclusivo de GESTOR DE IMPACTO -->
            <th:block sec:authorize="hasRole('GESTOR_IMPACTO')">
                <li><a th:href="@{/gestion-impacto/lotes}" th:classappend="${activa == 'impacto'} ? 'fw-bold'">Lotes y donaciones</a></li>
            </th:block>
        </ul>
    </nav>

    <!-- Botón flotante para desplegar el menú en arco en móvil -->
    <button type="button" class="hs-admin-fab" aria-label="Abrir menú del panel" aria-expanded="false">
        <i class="bi bi-grid" aria-hidden="true"></i>
    </button>
    <div class="hs-admin-fab-backdrop" hidden></div>

    <div class="flex-grow-1">
        <header class="d-flex justify-content-end align-items-center gap-3 p-3 border-bottom">
            <div class="hs-admin-user">
                <span class="hs-avatar" aria-hidden="true"
                      th:text="${#strings.substring(#authentication.principal.nombre, 0, 1)}">A</span>
                <span th:text="${#authentication.principal.nombre}">Administrador</span>
            </div>
            <form th:action="@{/admin/logout}" method="post" class="m-0">
                <button class="hs-btn hs-btn--secundario" type="submit">Cerrar sesión</button>
            </form>
        </header>

        <div class="container-fluid pt-3">
            <div class="alert alert-success" role="status" th:if="${exito}" th:text="${exito}">Guardado.</div>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">Error.</div>
        </div>
        <th:block th:replace="${contenido}"/>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
