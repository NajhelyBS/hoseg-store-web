name: CI - Pruebas Automatizadas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ejecutar pruebas unitarias e integración
        run: mvn -B test

      - name: Guardar reportes Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas
          path: target/surefire-reports
